<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Soft Gold Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle / Rounded Badge Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Subtle Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="95" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Star of Excellence at Top Center -->
  <path d="M256 65 L263 88 L286 95 L263 102 L256 125 L249 102 L226 95 L249 88 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#glow)">
    <!-- Cap Diamond / Top -->
    <polygon points="256,120 420,185 256,250 92,185" fill="#ffffff" />
    <polygon points="256,128 405,185 256,242 107,185" fill="#f8fafc" />

    <!-- Cap Skullcap / Lower Base -->
    <path d="M165 215 L165 260 C 165 295, 347 295, 347 260 L 347 215 C 310 240, 202 240, 165 215 Z" fill="#e2e8f0" />

    <!-- Cap Button & Golden Tassel -->
    <circle cx="256" cy="185" r="9" fill="url(#goldGrad)" />
    <!-- Tassel String & Hanging Brush -->
    <path d="M256 185 Q 210 195, 175 225 L 170 295" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <polygon points="163,295 177,295 174,325 166,325" fill="url(#goldGrad)" />
    <circle cx="170" cy="295" r="6" fill="#f59e0b" />
  </g>

  <!-- Open Educational Knowledge Book Underneath -->
  <g filter="url(#glow)">
    <!-- Book Base / Binding Spine -->
    <path d="M 256 345 L 256 425" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Left Page -->
    <path d="M 256 350 C 210 330, 140 335, 110 355 L 110 425 C 140 405, 210 400, 256 420 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 135 370 C 165 355, 215 355, 240 365" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 135 385 C 165 370, 215 370, 240 380" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 135 400 C 165 385, 215 385, 240 395" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M 256 350 C 302 330, 372 335, 402 355 L 402 425 C 372 405, 302 400, 256 420 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 272 365 C 297 355, 347 355, 377 370" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 272 380 C 297 370, 347 370, 377 385" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 272 395 C 297 385, 347 385, 377 400" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Laurel Wreath of Academic Honor (Leaves around bottom) -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Left Leaves -->
    <path d="M85 320 Q 95 310, 110 320 Q 100 330, 85 320 Z"/>
    <path d="M75 350 Q 88 342, 100 355 Q 87 362, 75 350 Z"/>
    <path d="M78 385 Q 92 380, 102 395 Q 88 400, 78 385 Z"/>
    <!-- Right Leaves -->
    <path d="M427 320 Q 417 310, 402 320 Q 412 330, 427 320 Z"/>
    <path d="M437 350 Q 424 342, 412 355 Q 425 362, 437 350 Z"/>
    <path d="M434 385 Q 420 380, 410 395 Q 424 400, 434 385 Z"/>
  </g>
</svg>
